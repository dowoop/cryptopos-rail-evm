[project]
name = "cryptopos-rail-evm"
# NOT 'dependency-free', which this said until 2026-09-04 while the wheel
# carried `Requires-Dist: cryptopos-core`. The summary is the one line PyPI
# shows beside the name, so it was the most-read false claim here.
description = "EVM payment rails (Sepolia and Amoy, native and ERC-20) for CryptoPoS: standard library plus cryptopos-core."
readme = "README.md"
requires-python = ">=3.9"
# PEP 639 SPDX form, matching `cryptopos-core`. This said
# `license = { text = "MIT" }` until 2026-09-04 -- the deprecated table form,
# which lands in the wheel as a free-text `License:` field where core's lands as
# `License-Expression: MIT`. Two of these four packages describing the same
# licence in two different metadata fields is the kind of difference a reader
# notices and cannot explain.
license = "MIT"
# DECLARED, not merely present. The LICENSE file was already reaching the wheel
# through hatchling's default, which is a behaviour rather than a promise.
license-files = ["LICENSE"]

# EVERY VERSION HERE WAS RUN, not inferred from `requires-python`. On
# 2026-09-04 the full suite was installed from this wheel and executed on
# CPython 3.9.25, 3.10.20, 3.11.15, 3.12.13, 3.13.14 and 3.14.4 -- 686 tests
# across the four packages, twice each, the second pass turning
# DeprecationWarning and SyntaxWarning into errors. A trove classifier is a
# support claim, and claiming a version nobody ran is how it becomes false.
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Topic :: Office/Business :: Financial :: Point-Of-Sale",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
]

# The version is dynamic because two declarations of one fact drifted apart by
# a patch release. The module is now the single source, and Hatch derives the
# distribution metadata from it.
dynamic = ["version"]

# ONE DEPENDENCY, AND IT IS DECLARED. `cryptopos-rail-solana` 0.1.0 shipped with
# `dependencies = []` while importing four core modules, so it installed cleanly
# into an environment where it could not run. A range rather than a pin: these
# rails use the PaymentRail protocol and the address and URI helpers, all of
# which are covered by core's frozen API, so a core patch release must not force
# a release here. The `<3` CEILING is what is deliberate -- a major core release
# is where those helpers could move, and an unbounded range would let a resolver
# pair this wheel with a core that no longer has them. (This paragraph said
# "`<2` ceiling" until 2026-08-31, contradicting the declaration three lines
# down. It was true before the 2.0 split and became a comment describing a
# constraint that had been replaced by its opposite.)
# `>=2`, NOT `>=1.1`, and that was measured rather than reasoned. Core 1.1
# ships these adapters itself and declares its own `cryptopos.rails` entry
# points for them, so installing this package beside it registers one rail key
# twice and `RailRegistry.discover()` raises:
#
#     DuplicateRail: More than one payment-rail plugin registered
#     'bitcoin:testnet4/native:btc'.
#
# That is not a degraded mode -- discovery fails outright, so a host loses every
# rail, not just the duplicated one. A `<2` ceiling would have permitted exactly
# that combination. This package is a core 2.0 artifact and says so.
dependencies = ["cryptopos-core>=2,<3"]

[project.entry-points."cryptopos.rails"]
ethereum-sepolia-eth = "cryptopos_rail_evm:ethereum_sepolia"
ethereum-sepolia-usdc = "cryptopos_rail_evm:usdc_ethereum_sepolia"
polygon-amoy-pol = "cryptopos_rail_evm:polygon_amoy"
polygon-amoy-usdc = "cryptopos_rail_evm:usdc_polygon_amoy"

[project.urls]
Source = "https://github.com/dowoop/cryptopos-rail-evm"

[build-system]
requires = ["hatchling==1.32.0"]
build-backend = "hatchling.build"

[tool.hatch.version]
path = "src/cryptopos_rail_evm/__init__.py"

[tool.hatch.build.targets.wheel]
packages = ["src/cryptopos_rail_evm"]

[tool.hatch.build.targets.sdist]
# `tools/` ships so that a cloner can run the README gate this package's
# own testing section tells them to run.
include = ["src/", "tests/", "tools/", "pyproject.toml", "README.md", "LICENSE"]

[tool.ruff]
line-length = 110
target-version = "py39"

[tool.ruff.format]
quote-style = "double"
indent-style = "tab"

[tool.ruff.lint]
select = ["F", "E", "W", "I", "UP", "B", "RUF"]
ignore = ["E501", "W191"]
